name: LLMUsage
options:
  bundleIdPrefix: com.dnikolsk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LLMUsage:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
    dependencies:
      - target: UsageWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnikolsk.llmusage
        CODE_SIGN_ENTITLEMENTS: App/LLMUsage.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LLM Usage
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [llmusage]
  UsageWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnikolsk.llmusage.widget
        CODE_SIGN_ENTITLEMENTS: Widget/UsageWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: LLM Usage Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
